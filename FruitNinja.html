<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="portrait">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>切水果大师</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
            /* iPhone刘海屏适配 */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        @media (max-width: 480px) {
            .game-hud {
                top: env(safe-area-inset-top);
                left: 10px;
                right: 10px;
            }
            .hud-item {
                font-size: 16px;
                padding: 6px 10px;
            }
            .title {
                font-size: 32px;
            }
            .menu-btn {
                width: 260px;
                padding: 16px 24px;
                font-size: 20px;
            }
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            transition: opacity 0.3s;
        }

        .ui-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title {
            font-size: 42px;
            color: #ffd700;
            text-shadow: 0 0 20px #ff6b35, 0 4px 0 #c44d20;
            margin-bottom: 35px;
            animation: pulse 2s infinite;
        }

        @media (max-width: 480px) {
            .title {
                font-size: 32px;
            }
            .menu-btn {
                width: 260px;
                padding: 16px 24px;
                font-size: 20px;
            }
            .hud-item {
                font-size: 18px;
                padding: 8px 14px;
            }
            .game-over-title {
                font-size: 32px;
            }
            .final-score {
                font-size: 22px;
            }
            .final-score span {
                font-size: 28px;
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .menu-btn {
            width: 280px;
            padding: 18px 30px;
            margin: 12px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #ff6b35 0%, #e74c3c 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #b33a2c, 0 6px 20px rgba(255, 107, 53, 0.4);
            min-height: 60px;
        }

        .menu-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b33a2c;
        }

        .menu-btn.secondary {
            background: linear-gradient(180deg, #3498db 0%, #2980b9 100%);
            box-shadow: 0 4px 0 #1a5a8a, 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        .menu-btn.secondary:hover {
            box-shadow: 0 6px 0 #1a5a8a, 0 8px 25px rgba(52, 152, 219, 0.5);
        }

        .menu-btn.tertiary {
            background: linear-gradient(180deg, #9b59b6 0%, #8e44ad 100%);
            box-shadow: 0 4px 0 #6c3483, 0 6px 20px rgba(155, 89, 182, 0.4);
        }

        .menu-btn.tertiary:hover {
            box-shadow: 0 6px 0 #6c3483, 0 8px 25px rgba(155, 89, 182, 0.5);
        }

        .mode-desc {
            color: #aaa;
            font-size: 14px;
            margin-top: -5px;
            margin-bottom: 15px;
        }

        .game-hud {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        .game-hud > * {
            pointer-events: auto;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .hud-item span {
            color: #ffd700;
        }

        .combo-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            color: #ffd700;
            text-shadow: 0 0 30px #ff6b35, 0 0 60px #e74c3c;
            pointer-events: none;
            opacity: 0;
            z-index: 60;
            transition: all 0.3s;
        }

        .combo-display.show {
            opacity: 1;
            animation: comboPop 0.5s ease-out;
        }

        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .final-score {
            font-size: 28px;
            color: #fff;
            margin: 20px 0;
        }

        .final-score span {
            color: #ffd700;
            font-size: 36px;
        }

        .game-over-title {
            font-size: 42px;
            color: #e74c3c;
            text-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="mainMenu" class="ui-overlay">
        <div class="title">🍉 切水果大师 🍎</div>
        <button class="menu-btn" onclick="startGame('classic')">
            经典模式
        </button>
        <div class="mode-desc">15条生命，切水果加分，躲炸弹</div>
        <button class="menu-btn secondary" onclick="showPlayerInfo()">
            极限模式
        </button>
        <div class="mode-desc">60秒倒计时挑战</div>
        <button class="menu-btn tertiary" onclick="showLeaderboard()">
            🏆 排行榜
        </button>
        <button class="menu-btn secondary" onclick="showTutorial()">
            玩法说明
        </button>
    </div>

    <div id="gameOver" class="ui-overlay hidden">
        <div class="game-over-title" id="gameOverTitle">游戏结束</div>
        <div class="final-score">
            最终得分: <span id="finalScore">0</span>
        </div>
        <div class="final-score" style="font-size: 18px;">
            切割水果: <span id="fruitsCut">0</span> 个
        </div>
        <div id="leaderboardNotice" class="final-score" style="font-size: 16px; color: #aaa; display: none;"></div>
        <div id="saveNotice" class="final-score" style="font-size: 18px; color: #4ade80; display: none;">✅ 成绩已保存到排行榜！</div>
        <button class="menu-btn" onclick="restartGame()">再来一局</button>
        <button class="menu-btn tertiary" id="viewLeaderboardBtn" style="display: none;" onclick="showLeaderboard()">🏆 查看排行榜</button>
        <button class="menu-btn secondary" onclick="showMainMenu()">返回菜单</button>
    </div>

    <div id="tutorial" class="ui-overlay hidden">
        <div class="title" style="font-size: 32px;">🎮 玩法说明</div>
        <div style="color: #fff; text-align: left; line-height: 2; padding: 20px 40px;">
            <p>🖱️ <b>鼠标滑动</b> 或 <b>手指滑动</b> 切割水果</p>
            <p>⚡ 滑动越快，切割越准确</p>
            <p>🍉 每切到一个水果得 10 分</p>
            <p>💥 连续切割有连击加成</p>
            <p>💣 小心炸弹！切到会扣1条命</p>
            <p>⏱️ 极限模式60秒倒计时</p>
            <p>❤️ 经典模式有15条生命</p>
        </div>
        <button class="menu-btn" onclick="showMainMenu()">知道了</button>
    </div>

    <div id="leaderboard" class="ui-overlay hidden">
        <div class="title" style="font-size: 32px;">🏆 极限模式排行榜</div>
        <div id="leaderboardList" style="color: #fff; text-align: left; line-height: 2.2; padding: 10px 40px; max-height: 50vh; overflow-y: auto;"></div>
        <button class="menu-btn secondary" style="background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%); box-shadow: 0 4px 0 #922b21; margin-top: 10px;" onclick="clearLeaderboard()">🗑️ 清除排行榜</button>
        <button class="menu-btn" onclick="showMainMenu()">返回菜单</button>
    </div>

    <div id="playerInfo" class="ui-overlay hidden">

            <div style="margin-bottom: 15px;">

            </div>

        <button class="menu-btn secondary" onclick="showMainMenu()">返回</button>

        <button class="menu-btn secondary" onclick="exitToMainMenu()">退出游戏</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 音频上下文
        let audioContext;
        let bgMusic = null;
        let bgMusicLoaded = false;
        let musicPlaying = false;
        let currentMusicState = '';
        let musicTimeoutId = null;
        let activeOscillators = [];

        // 初始化音频
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        // 停止所有活动的声音节点
        function stopAllMusic() {
            if (musicTimeoutId) {
                clearTimeout(musicTimeoutId);
                musicTimeoutId = null;
            }
            activeOscillators.forEach(osc => {
                try { osc.stop(); } catch(e) {}
            });
            activeOscillators = [];
        }

        // 播放切水果音效
        function playSliceSound() {
            try {
                const ctx = initAudio();
                if (ctx.state === 'suspended') ctx.resume();

                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, ctx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.15);

                gainNode.gain.setValueAtTime(0.4, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);

                oscillator.start(ctx.currentTime);
                oscillator.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        // 播放炸弹爆炸音效
        function playBombSound() {
            try {
                const ctx = initAudio();
                if (ctx.state === 'suspended') ctx.resume();

                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);

                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, ctx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.3);

                gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

                oscillator.start(ctx.currentTime);
                oscillator.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        // 播放背景音乐
        function playBackgroundMusic(state) {
            if (!musicPlaying) return;
            if (state === currentMusicState && activeOscillators.length > 0) return;

            stopAllMusic();
            currentMusicState = state;

                const ctx = initAudio();
                if (ctx.state === 'suspended') ctx.resume();

                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(vol, startTime + 0.05);
                    gain.gain.linearRampToValueAtTime(vol * 0.8, startTime + duration * 0.5);

        function getLeaderboard() {
            const data = localStorage.getItem('fruitNinjaLeaderboard');
            return data ? JSON.parse(data) : [];
        }

        function saveScore(score) {
            const leaderboard = getLeaderboard();
            const date = new Date().toLocaleDateString('zh-CN');
            const name = playerName || '匿名玩家';
            const location = playerLocation || '未知地区';
            const entry = { score, date, name, location };

            const existIndex = leaderboard.findIndex(e => e.name === name && e.location === location);
            if (existIndex !== -1) {
                if (score > leaderboard[existIndex].score) {
                    leaderboard.splice(existIndex, 1);
                    leaderboard.push(entry);
                }
            } else {
                leaderboard.push(entry);
            }

            leaderboard.sort((a, b) => b.score - a.score);
            if (leaderboard.length > 10) leaderboard.length = 10;
            localStorage.setItem('fruitNinjaLeaderboard', JSON.stringify(leaderboard));
        }

        function renderLeaderboard() {
            const list = getLeaderboard();
            const container = document.getElementById('leaderboardList');
            if (list.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #aaa;">暂无记录，快去游戏吧！</div>';
                return;
            }
            const medals = ['🥇', '🥈', '🥉'];
            container.innerHTML = list.map((item, i) => {
                const medal = medals[i] || `#${i + 1}`;
                return `<div style="padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <span>${medal} 第${i + 1}名</span>
                        <span style="color: #ffd700; font-size: 20px;">${item.score} 分</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 14px; color: #aaa;">
                        <span>${item.name || '匿名玩家'}</span>
                        <span>${item.location || '未知地区'}</span>
                    </div>
                </div>`;
            }).join('');
        }

                const leaderboard = getLeaderboard();
                const rank = leaderboard.findIndex(entry => entry.score === score && entry.name === playerName) + 1;

                if (rank > 0 && rank <= 10) {
                    notice.textContent = `🎉 恭喜上榜！当前排名：第${rank}名`;

                const secs = Math.floor(timeLeft % 60);
                document.getElementById('timeDisplay').textContent =
                    String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            }

        function spawnFruit() {
            if (gameState !== 'playing') return;

            const isEndless = gameMode === 'endless';
            const fruitCount = isEndless ? (Math.floor(Math.random() * 3) + 2) : 1;
            const baseDelay = isEndless ? 300 : 800;

            for (let i = 0; i < fruitCount; i++) {
                const data = fruitsData[Math.floor(Math.random() * fruitsData.length)];
                const x = width * 0.15 + Math.random() * width * 0.7;
                const speed = isEndless ? (18 + Math.random() * 8) : (18 + Math.random() * 6);
                let angle, dir;

                if (isEndless) {
                    angle = (30 + Math.random() * 60) * Math.PI / 180;
                    dir = Math.random() > 0.5 ? 1 : -1;
                } else {
                    dir = x < width / 2 ? 1 : -1;
                    const distToCenter = Math.abs(x - width / 2) / (width / 2);
                    angle = (55 + distToCenter * 20) * Math.PI / 180;
                }

                fruits.push({
                    x: x,
                    y: height + 50,
                    vx: Math.cos(angle) * speed * dir,
                    vy: -Math.sin(angle) * speed,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.2,
                    radius: data.radius,
                    color: data.color,
                    juiceColor: data.juiceColor,
                    name: data.name,
                    points: data.points,
                    sliced: false,
                    halves: null,
                    isBomb: data.isBomb || false
                });
            }

            setTimeout(spawnFruit, baseDelay + Math.random() * (isEndless ? 300 : 600));
        }

        function createParticles(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 5,
                    color: color,
                    alpha: 1,
                    decay: 0.02 + Math.random() * 0.02
                });
            }
        }

        function createSliceEffect(x, y, vx, vy) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.atan2(vy, vx) + (Math.random() - 0.5) * 1;
                const speed = 3 + Math.random() * 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 2 + Math.random() * 3,
                    color: '#fff',
                    alpha: 0.8,
                    decay: 0.05
                });
            }
        }

        function sliceFruit(fruit, cutDir) {
            fruit.sliced = true;

            // 如果切到炸弹
            if (fruit.isBomb) {
                playBombSound();
                createParticles(fruit.x, fruit.y, '#ff4444', 30);
                if (gameMode === 'classic') {
                    lives--;
                    updateHUD();
                    if (lives <= 0) {
                        endGame();
                    }
                } else {
                    score = Math.max(0, score - 10);
                    updateHUD();
                }
                return;
            }

            fruitsCutCount++;
            score += fruit.points * 10;
            combo++;
            lastComboTime = Date.now();

            if (combo >= 3) {
                showCombo(combo);
                score += (combo - 2) * 10;
            }

            createParticles(fruit.x, fruit.y, fruit.juiceColor, 20);
            playSliceSound();

            if (gameMode === 'classic' && score >= 400) {
                winGame();
                return;
            }

            fruit.halves = [
                { x: fruit.x, y: fruit.y, vx: fruit.vx - 3, vy: fruit.vy - 2, rotation: fruit.rotation, side: 'left' },
                { x: fruit.x, y: fruit.y, vx: fruit.vx + 3, vy: fruit.vy - 2, rotation: fruit.rotation, side: 'right' }
            ];

            updateHUD();
        }

        function showCombo(count) {
            const display = document.getElementById('comboDisplay');
            display.textContent = count + ' 连击!';
            display.classList.remove('show');
            void display.offsetWidth;
            display.classList.add('show');

            setTimeout(() => {
                display.classList.remove('show');
            }, 800);
        }

        function drawFruit(f) {
            ctx.save();
            ctx.translate(f.x, f.y);
            ctx.rotate(f.rotation);

            ctx.beginPath();
            ctx.arc(0, 0, f.radius, 0, Math.PI * 2);

            const gradient = ctx.createRadialGradient(-f.radius * 0.3, -f.radius * 0.3, 0, 0, 0, f.radius);
            gradient.addColorStop(0, lightenColor(f.color, 40));
            gradient.addColorStop(1, f.color);
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.strokeStyle = darkenColor(f.color, 30);
            ctx.lineWidth = 2;
            ctx.stroke();

            if (f.name === 'apple') {
                ctx.fillStyle = '#5d4037';
                ctx.fillRect(-2, -f.radius - 8, 4, 12);
                ctx.fillStyle = '#4caf50';
                ctx.beginPath();
                ctx.ellipse(6, -f.radius - 5, 8, 5, 0.5, 0, Math.PI * 2);
                ctx.fill();
            } else if (f.name === 'watermelon') {
                ctx.beginPath();
                ctx.arc(0, 0, f.radius * 0.7, 0, Math.PI * 2);
                ctx.fillStyle = '#e74c3c';
                ctx.fill();
                ctx.fillStyle = '#2d2d2d';
                for (let i = 0; i < 6; i++) {
                    const a = i * Math.PI / 3;
                    ctx.beginPath();
                    ctx.ellipse(Math.cos(a) * f.radius * 0.4, Math.sin(a) * f.radius * 0.4, 3, 2, a, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (f.name === 'orange') {
                ctx.fillStyle = '#ff9800';
                ctx.beginPath();
                ctx.arc(0, 0, f.radius * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = '#5d4037';
                ctx.fill();
            } else if (f.name === 'bomb') {
                // 炸弹引线
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, -f.radius);
                ctx.lineTo(5, -f.radius - 10);
                ctx.stroke();
                // 引线火花
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(5, -f.radius - 12, 4, 0, Math.PI * 2);
                ctx.fill();
                // 骷髅图案
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-5, -3, 4, 0, Math.PI * 2);
                ctx.arc(5, -3, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(0, 5, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#2c2c2c';
                ctx.beginPath();
                ctx.arc(-5, -3, 2, 0, Math.PI * 2);
                ctx.arc(5, -3, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(-4, 4, 8, 3);
            }

            ctx.restore();
        }

        function drawSlicedHalf(half, originalRadius, color) {
            ctx.save();
            ctx.translate(half.x, half.y);
            ctx.rotate(half.rotation);

            ctx.beginPath();
            ctx.arc(0, 0, originalRadius, -Math.PI / 2, Math.PI / 2);
            ctx.closePath();

            const gradient = ctx.createRadialGradient(-originalRadius * 0.2, 0, 0, 0, 0, originalRadius);
            gradient.addColorStop(0, lightenColor(color, 30));
            gradient.addColorStop(1, color);
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, originalRadius * 0.85, -Math.PI / 2, Math.PI / 2);
            ctx.fillStyle = lightenColor(color, 50);
            ctx.fill();

            ctx.restore();
        }

        function drawBladeTrail() {
            if (bladeTrail.length < 2) return;

            ctx.beginPath();
            ctx.moveTo(bladeTrail[0].x, bladeTrail[0].y);

            for (let i = 1; i < bladeTrail.length; i++) {
                ctx.lineTo(bladeTrail[i].x, bladeTrail[i].y);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255, 200, 100, 0.5)';
            ctx.lineWidth = 8;
            ctx.stroke();
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = hexToRgba(p.color, p.alpha);
                ctx.fill();
            });
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function lightenColor(hex, percent) {
            const num = parseInt(hex.slice(1), 16);
            const amt = Math.round(2.55 * percent);
            const r = Math.min(255, (num >> 16) + amt);
            const g = Math.min(255, ((num >> 8) & 0x00FF) + amt);
            const b = Math.min(255, (num & 0x0000FF) + amt);
            return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
        }

        function darkenColor(hex, percent) {
            const num = parseInt(hex.slice(1), 16);
            const amt = Math.round(2.55 * percent);
            const r = Math.max(0, (num >> 16) - amt);
            const g = Math.max(0, ((num >> 8) & 0x00FF) - amt);
            const b = Math.max(0, (num & 0x0000FF) - amt);
            return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
        }

        function update() {
            if (gameState !== 'playing' || gamePaused) return;

            const dt = 1 / 60;
            const gravity = 0.3;

            fruits.forEach(f => {
                if (!f.sliced) {
                    f.vy += gravity;
                    f.x += f.vx;
                    f.y += f.vy;
                    f.rotation += f.rotationSpeed;
                } else if (f.halves) {
                    f.halves.forEach(h => {
                        h.vy += gravity;
                        h.x += h.vx;
                        h.y += h.vy;
                        h.rotation += 0.15;
                    });
                }
            });

            fruits = fruits.filter(f => {
                if (f.sliced) {
                    return f.halves && f.halves.every(h => h.y < height + 100);
                }
                if (f.y > height + 100) {
                    // 只有非炸弹的水果掉出屏幕才扣生命
                    if (gameMode === 'classic' && !f.sliced && !f.isBomb) {
                        lives--;
                        updateHUD();
                        if (lives <= 0) {
                            endGame();
                        }
                    }
                    return false;
                }
                return true;
            });

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15;
                p.alpha -= p.decay;
                p.radius *= 0.98;
            });
            particles = particles.filter(p => p.alpha > 0);

            bladeTrail.forEach(p => {
                p.alpha -= 0.08;
            });
            bladeTrail = bladeTrail.filter(p => p.alpha > 0);

            if (Date.now() - lastComboTime > 1000 && combo > 0) {
                combo = 0;
            }

            if (gameMode === 'endless') {
                timeLeft -= dt;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    endGame();
                }
            }

            updateHUD();
        }

        function draw() {
            if (backgroundImage.complete && backgroundImage.naturalWidth > 0) {
                ctx.drawImage(backgroundImage, 0, 0, width, height);
            } else {
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, width, height);

                const gradient = ctx.createLinearGradient(0, 0, 0, height);
                gradient.addColorStop(0, '#16213e');
                gradient.addColorStop(1, '#0f3460');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
                for (let i = 0; i < 50; i++) {
                    const x = (i * 73) % width;
                    const y = (i * 91) % height;
                    ctx.beginPath();
                    ctx.arc(x, y, 1, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            drawParticles();

            fruits.forEach(f => {
                if (f.sliced && f.halves) {
                    f.halves.forEach(h => drawSlicedHalf(h, f.radius, f.color));
                } else if (!f.sliced) {
                    drawFruit(f);
                }
            });

            drawBladeTrail();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function handleStart(e) {
            e.preventDefault();
            if (gameState !== 'playing') return;

            isMouseDown = true;
            const pos = getEventPos(e);
            lastMousePos = pos;
            lastMouseUpdate = Date.now();
            bladeTrail = [{ x: pos.x, y: pos.y, alpha: 1 }];
        }

        function handleMove(e) {
            e.preventDefault();
            if (!isMouseDown || gameState !== 'playing') return;

            const pos = getEventPos(e);
            const now = Date.now();
            const dt = (now - lastMouseUpdate) / 1000;

            if (dt > 0.001) {
                currentVelocity.x = (pos.x - lastMousePos.x) / dt;
                currentVelocity.y = (pos.y - lastMousePos.y) / dt;
            }

            const speed = Math.sqrt(currentVelocity.x * currentVelocity.x + currentVelocity.y * currentVelocity.y);

            bladeTrail.push({ x: pos.x, y: pos.y, alpha: 1 });
            if (bladeTrail.length > 20) bladeTrail.shift();

            if (speed > 100) {
                const cutDir = { x: currentVelocity.x / speed, y: currentVelocity.y / speed };

                fruits.forEach(f => {
                    if (f.sliced) return;

                    const dx = pos.x - f.x;
                    const dy = pos.y - f.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < f.radius + 30) {
                        const dotProduct = dx * cutDir.x + dy * cutDir.y;
                        if (Math.abs(dotProduct) > 15) {
                            sliceFruit(f, cutDir);
                            createSliceEffect(f.x, f.y, cutDir.x * 5, cutDir.y * 5);
                        }
                    }
                });
            }

            lastMousePos = pos;
            lastMouseUpdate = now;
        }

        function handleEnd(e) {
            e.preventDefault();
            isMouseDown = false;
            currentVelocity = { x: 0, y: 0 };
        }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('mouseleave', handleEnd);

        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchend', handleEnd, { passive: false });
        canvas.addEventListener('touchcancel', handleEnd, { passive: false });

        document.body.addEventListener('touchmove', function(e) {
            if (e.target === canvas) {
                e.preventDefault();
            }
        }, { passive: false });

        gameLoop();
        showMainMenu();
    </script>
</body>
</html>
